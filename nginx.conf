# Reverse proxy: the only public service. Routes / to the frontend and /api/ to the backend.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @backend_down;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    location / {
        proxy_pass http://frontend:80;
    }

    # Same JSON shape the backend uses, so the frontend shows a clear message.
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limit_exceeded","message":"Too many requests. Please wait a minute and try again.","request_id":"proxy"}}';
    }
    location @backend_down {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable","message":"The legal information service is temporarily unavailable. Please try again shortly.","request_id":"proxy"}}';
    }
}

# HTTPS (production): get a certificate for your domain, mount it into the proxy container,
# publish 443, then add a second server block:
#   listen 443 ssl; ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
# and make the port 80 block redirect: return 301 https://$host$request_uri;
